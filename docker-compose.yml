services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-audiovisual_api}
      MYSQL_USER: ${MYSQL_USER:-audiovisual}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-audiovisual}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-p$$MYSQL_ROOT_PASSWORD']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_DATA_FILE: /data/mailpit.db
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    volumes:
      - mailpit_data:/data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - .:/app
      - /app/node_modules
    # El volumen anónimo de node_modules aísla las dependencias del
    # contenedor (compiladas para Linux) de las de /app en el host, pero
    # por eso mismo puede quedar desincronizado con package.json/package-lock.json
    # tras un `docker compose build` (Docker reutiliza el volumen existente en
    # vez de repoblarlo desde la imagen). El `npm ci` en cada arranque
    # garantiza que node_modules (y el cliente de Prisma, vía postinstall)
    # siempre coincidan con el lockfile actual, sin depender de ese volumen.
    command: sh -c "npm ci --no-audit --no-fund && npm run start:dev"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  mysql_data:
  redis_data:
  mailpit_data: